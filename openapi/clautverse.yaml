components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: better-auth.session_token
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
            - requestId
          properties:
            code:
              type: string
              enum:
                - VALIDATION_FAILED
                - UNAUTHENTICATED
                - FORBIDDEN
                - ACCOUNT_SUSPENDED
                - EMAIL_NOT_VERIFIED
                - NOT_FOUND
                - CONFLICT
                - INVALID_STATE
                - ONBOARDING_REQUIRED
                - FEATURE_DISABLED
                - PAYLOAD_TOO_LARGE
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
            requestId:
              type:
                - string
                - 'null'
            details:
              type: object
    Page:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items: {}
        nextCursor:
          type:
            - string
            - 'null'
  responses:
    Error:
      description: Error envelope
      headers:
        X-Request-Id:
          schema:
            type: string
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
