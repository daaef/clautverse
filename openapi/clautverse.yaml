# Clautverse API contract (machine-readable source of truth).
# guide/content/99.api-reference must agree with this file; guide/tests/unit/openapi-sync.test.ts enforces it.
openapi: 3.1.0
info:
  title: Clautverse API
  version: 2.0.0
  description: 'Approved Clautverse API contract (v2). Unversioned /api paths; additive-only changes. x-status:
    implemented | planned | deferred.'
servers:
  - url: /
paths:
  /api/admin/applications:
    get:
      operationId: ADM_02
      summary: ADM-02 GET /api/admin/applications?status=&limit=&cursor=
      tags:
        - ADM
      x-route-id: ADM-02
      x-status: implemented
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - pending
              - accepted
              - declined
            example: pending
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            example: 20
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            example: ""
            description: Leave empty for page 1; then paste nextCursor from the previous response
      responses:
        '200':
          description: Success
        default:
          $ref: '#/components/responses/Error'
  /api/admin/applications/{id}:
    get:
      operationId: ADM_03
      summary: ADM-03 GET /api/admin/applications/:id
      tags:
        - ADM
      x-route-id: ADM-03
      x-status: implemented
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
            format: uuid
